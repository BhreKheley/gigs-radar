# ==============================================================================
# Nginx Reverse Proxy & Static Accelerator Configuration — Gigs Radar
# ==============================================================================

upstream gigsradar_backend {
    server web:8000;
    keepalive 32;
}

# Rate limiting zone: max 30 requests/s per IP
limit_req_zone $binary_remote_addr zone=gigsradar_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static Assets Direct Serving
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Uploads (Foto Panggung & Band) Direct Serving
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Health Check Bypass (Direct & Unthrottled)
    location /healthz {
        proxy_pass http://gigsradar_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Application Proxy
    location / {
        limit_req zone=gigsradar_limit burst=50 nodelay;

        proxy_pass http://gigsradar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
